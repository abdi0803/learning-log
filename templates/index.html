<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><title>Learning Log</title></head>
<body>
  <h1>Learning Log</h1>

  <form action="/add" method="post">
    <input name="topic" placeholder="Emne (fx Docker)" required>
    <input name="minutes" type="number" placeholder="Minutter" required>
    <input name="notes" placeholder="Noter">
    <button type="submit">Gem</button>
  </form>

  <table border="1" cellpadding="6">
    <tr><th>Dato</th><th>Emne</th><th>Min</th><th>Noter</th></tr>
    {% for log in logs %}
    <tr>
      <td>{{ log["date"] }}</td>
      <td>{{ log["topic"] }}</td>
      <td>{{ log["minutes"] }}</td>
      <td>{{ log["notes"] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
